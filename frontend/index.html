<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game List Catalog</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 50px auto; padding: 20px; }
        .card { border: 1px solid #ddd; padding: 20px; border-radius: 8px; box-shadow: 2px 2px 10px #eee; }
        ul { list-style: none; padding: 0; }
        li { background: #f4f4f4; margin: 5px 0; padding: 10px; border-radius: 4px; }
        input { padding: 10px; width: 70%; }
        button { padding: 10px; cursor: pointer; background: #28a745; color: white; border: none; }
    </style>
</head>
<body>

<div class="card">
    <h2 id="judul">Loading...</h2>
    <p>Owner: <span id="owner">-</span> (<span id="nim">-</span>)</p>
    
    <ul id="game-list"></ul>

    <hr>
    <input type="text" id="new-game" placeholder="Tambah game baru...">
    <button onclick="addGame()">Tambah</button>
</div>

<script>
    const API_URL = "/api";

    async function fetchData() {
        const res = await fetch(`${API_URL}/info`);
        const data = await res.json();
        
        document.getElementById('judul').innerText = data.judul_katalog;
        document.getElementById('owner').innerText = data.pemilik;
        document.getElementById('nim').innerText = data.nim;

        const list = document.getElementById('game-list');
        list.innerHTML = "";
        data.items.forEach(item => {
            const li = document.createElement('li');
            li.textContent = item;
            list.appendChild(li);
        });
    }

    async function addGame() {
        const input = document.getElementById('new-game');
        const itemName = input.value;
        if (!itemName) return;

        const res = await fetch(`${API_URL}/add-item`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ item: itemName })
        });

        if (res.ok) {
            input.value = "";
            fetchData();
        }
    }

    fetchData();
</script>
</body>
</html>
